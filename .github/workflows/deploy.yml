name: CI

on:
  push:
    branches: [master]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: trener/package-lock.json
      - name: Install dependencies
        working-directory: trener
        run: npm ci
      - name: Type check
        working-directory: trener
        run: npx tsc --noEmit
      - name: Build
        working-directory: trener
        run: npm run build
