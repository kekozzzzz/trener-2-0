<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Технические работы — Whygrid</title>
<style>
  :root {
    --bg: #0E0E0E;
    --surface: #1A1A1A;
    --line: #2A2A2A;
    --text: #F5F5F5;
    --muted: #8C8C8C;
    --accent: #D4FF33;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 48px 32px;
    text-align: center;
  }
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid var(--accent);
  }
  .card::before {
    top: -1px;
    left: -1px;
    border-right: none;
    border-bottom: none;
  }
  .card::after {
    bottom: -1px;
    right: -1px;
    border-left: none;
    border-top: none;
  }
  .wordmark {
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .wordmark .why { color: var(--accent); }
  .wordmark .grid { color: var(--text); }
  .label {
    font-family: "JetBrains Mono", "Consolas", "SFMono-Regular", monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.2;
    margin: 0 0 16px;
  }
  p {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 24px;
  }
  .contact {
    font-family: "JetBrains Mono", "Consolas", "SFMono-Regular", monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .contact a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  .contact a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark"><span class="why">WHY</span><span class="grid">GRID</span></div>
    <p class="label">Технические работы</p>
    <h1>Сайт временно недоступен</h1>
    <p>Обновляем сервис — обычно это занимает несколько минут. Обновите страницу чуть позже.</p>
    <div class="contact">Вопрос не ждёт — <a href="mailto:support@whygrid.app">support@whygrid.app</a></div>
  </div>
</body>
</html>
