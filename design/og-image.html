<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0E0E0E; --line:#2A2A2A; --text:#F5F5F5; --muted:#8C8C8C; --lime:#D4FF33;
  }
  html,body{ width:1200px; height:630px; background:var(--bg); overflow:hidden; }
  #card{
    width:1200px; height:630px; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  /* тонкая сетка на фоне — намёк на «grid», без второго акцента */
  #card::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:60px 60px;
    opacity:0.35;
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 68%);
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 68%);
  }
  #safe{
    position:relative;
    width:920px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  .mark{ display:flex; align-items:center; gap:20px; margin-bottom:28px; }
  .mark img{ width:64px; height:64px; display:block; }
  .wm{ font-family:'Golos Text', sans-serif; font-weight:900; font-size:56px; letter-spacing:0.5px; color:var(--text); }
  .wm .w{ color:var(--lime); }
  .tagline{ font-family:'Golos Text', sans-serif; font-weight:400; font-size:26px; color:var(--text); opacity:0.92; max-width:820px; line-height:1.4; margin-top:4px; }
  .kicker{ font-family:'JetBrains Mono', monospace; font-size:16px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-top:32px; }
</style>
</head>
<body>
<div id="card">
  <div id="safe">
    <div class="mark">
      <img src="mark-icon.png" alt="">
      <div class="wm"><span class="w">WHY</span>GRID</div>
    </div>
    <div class="tagline">Сократовский AI-тренер для турнирного покера</div>
    <div class="kicker">Парсер считает — ты понимаешь, почему</div>
  </div>
</div>
</body>
</html>
