<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0E0E0E; --line:#2A2A2A; --text:#F5F5F5; --muted:#8C8C8C; --lime:#D4FF33;
  }
  html,body{ width:2560px; height:1440px; background:var(--bg); overflow:hidden; }
  #banner{
    width:2560px; height:1440px; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  /* safe area ~1546x423, центр канваса — всё важное держим тут */
  #safe{
    width:1546px; height:423px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  .mark{ display:flex; align-items:center; gap:20px; margin-bottom:28px; }
  .mark img{ width:72px; height:72px; display:block; }
  .wm{ font-family:'Golos Text', sans-serif; font-weight:900; font-size:64px; letter-spacing:1px; color:var(--text); }
  .wm .w{ color:var(--lime); }
  .tagline{ font-family:'JetBrains Mono', monospace; font-size:28px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
</style>
</head>
<body>
<div id="banner">
  <div id="safe">
    <div class="mark">
      <img src="mark-icon.png" alt="">
      <div class="wm"><span class="w">WHY</span>GRID</div>
    </div>
    <div class="tagline">покерный тренер</div>
  </div>
</div>
</body>
</html>
