<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0E0E0E; --surface:#1A1A1A; --line:#2A2A2A;
    --text:#F5F5F5; --muted:#8C8C8C; --lime:#D4FF33;
  }
  html,body{ width:1080px; height:1080px; background:var(--bg); }
  #card{
    width:1080px; height:1080px; background:var(--bg); color:var(--text);
    font-family: Arial, Helvetica, sans-serif;
    padding:72px; display:flex; flex-direction:column;
  }
  .top{ display:flex; justify-content:space-between; align-items:center; }
  .wm{ font-weight:900; letter-spacing:1px; font-size:30px; }
  .wm .w{ color:var(--lime); }
  .tag{
    font-family:'Courier New', monospace; font-size:22px; letter-spacing:3px;
    color:var(--muted); text-transform:uppercase;
  }
  .hook{ margin-top:54px; font-weight:900; font-size:62px; line-height:1.05; max-width:900px; }
  .label{
    font-family:'Courier New', monospace; font-size:22px; letter-spacing:3px;
    color:var(--muted); text-transform:uppercase; margin-bottom:18px;
  }
  .sect{ margin-top:48px; }
  .cards{ display:flex; gap:18px; }
  .c{
    width:108px; height:150px; background:var(--surface); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .c .r{ font-weight:900; font-size:52px; line-height:1; }
  .c .s{ font-size:40px; line-height:1; margin-top:6px; }
  .c.brick{ opacity:0.45; }
  .heart .r,.heart .s{ color:var(--lime); }
  .dark .r,.dark .s{ color:var(--text); }
  .hero .c{ width:122px; height:170px; border-color:var(--lime); }
  .stat{
    margin-top:auto; border-top:1px solid var(--line); padding-top:40px;
    display:flex; align-items:flex-end; justify-content:space-between;
  }
  .stat .big{ font-family:'Courier New', monospace; font-weight:700; }
  .stat .eq{ font-size:96px; color:var(--lime); line-height:0.9; }
  .stat .sub{ font-family:'Courier New', monospace; font-size:26px; color:var(--muted); margin-top:10px; letter-spacing:1px; }
  .loss{ text-align:right; }
  .loss .num{ font-family:'Courier New', monospace; font-weight:700; font-size:72px; color:var(--text); line-height:0.9; }
  .loss .cap{ font-family:'Courier New', monospace; font-size:24px; color:var(--muted); letter-spacing:2px; margin-top:10px; }
  .foot{ margin-top:34px; display:flex; align-items:center; gap:16px; }
  .foot svg{ width:40px; height:40px; }
  .foot .url{ font-family:'Courier New', monospace; font-size:28px; color:var(--lime); letter-spacing:1px; }
</style>
</head>
<body>
<div id="card">
  <div class="top">
    <div class="wm"><span class="w">WHY</span>GRID</div>
    <div class="tag">Разбор раздачи</div>
  </div>

  <div class="hook">Погоня за флешем,<br>который не окупается</div>

  <div class="sect">
    <div class="label">Борд · тёрн → ривер</div>
    <div class="cards">
      <div class="c heart"><div class="r">K</div><div class="s">♥</div></div>
      <div class="c heart"><div class="r">7</div><div class="s">♥</div></div>
      <div class="c dark"><div class="r">2</div><div class="s">♣</div></div>
      <div class="c dark"><div class="r">2</div><div class="s">♠</div></div>
      <div class="c dark brick"><div class="r">4</div><div class="s">♦</div></div>
    </div>
  </div>

  <div class="sect hero">
    <div class="label">Твои карты</div>
    <div class="cards">
      <div class="c heart"><div class="r">T</div><div class="s">♥</div></div>
      <div class="c heart"><div class="r">9</div><div class="s">♥</div></div>
    </div>
  </div>

  <div class="stat">
    <div class="big">
      <div class="eq">18%</div>
      <div class="sub">эквити дро на тёрне · нужно 30%</div>
    </div>
    <div class="loss">
      <div class="num">−14 BB</div>
      <div class="cap">слил на одном решении</div>
    </div>
  </div>

  <div class="foot">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="6.5" y="6.5" width="8" height="8" fill="none" stroke="#F5F5F5" stroke-width="2"/>
      <rect x="17.5" y="6.5" width="8" height="8" fill="#D4FF33"/>
      <rect x="6.5" y="17.5" width="8" height="8" fill="none" stroke="#F5F5F5" stroke-width="2"/>
      <rect x="17.5" y="17.5" width="8" height="8" fill="none" stroke="#F5F5F5" stroke-width="2"/>
    </svg>
    <div class="url">whygrid.app</div>
  </div>
</div>
</body>
</html>
