<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#000000; --surface:#1A1A1A; --line:#2A2A2A; --text:#F5F5F5; --muted:#8C8C8C; --lime:#D4FF33; }
  html,body{ width:1080px; height:1080px; background:var(--bg); }
  #card{ width:1080px; height:1080px; background:var(--bg); color:var(--text); font-family:'Golos Text', sans-serif; padding:64px; display:flex; flex-direction:column; }
  .top{ display:flex; justify-content:space-between; align-items:center; }
  .wm{ font-weight:900; letter-spacing:1px; font-size:30px; }
  .wm .w{ color:var(--lime); }
  .tag{ font-family:'JetBrains Mono', monospace; font-size:22px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; }
  .mid{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .setup{ font-family:'JetBrains Mono', monospace; font-size:34px; color:var(--muted); max-width:960px; line-height:1.35; }
  .setup b{ color:var(--lime); font-weight:700; }
  .statrow{ margin-top:44px; display:flex; align-items:baseline; gap:24px; }
  .statrow .big{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:150px; line-height:0.9; color:var(--lime); }
  .statrow .subtext{ font-family:'JetBrains Mono', monospace; font-size:24px; letter-spacing:1px; color:var(--muted); max-width:360px; line-height:1.4; }
  .fact{ margin-top:52px; font-size:36px; line-height:1.45; color:var(--text); max-width:960px; }
  .foot{ display:flex; justify-content:flex-end; }
  .foot svg{ width:36px; height:36px; }
</style>
</head>
<body>
<div id="card">
  <div class="top"><div class="wm"><span class="w">WHY</span>GRID</div><div class="tag">Факт</div></div>
  <div class="mid">
    <div class="setup">Из блайндов против позднего рейза сквиз-диапазон доходит почти до -</div>
    <div class="statrow">
      <div class="big">33%</div>
      <div class="subtext">всех рук, включая слабые тузы как блокеры</div>
    </div>
    <div class="fact">
      Причина не в силе руки, а в мёртвых деньгах: если все сфолдят, банк уже твой. Слабый туз
      работает даже лучше многих сильных рук - он ещё и режет чужие тузовые комбинации.
    </div>
  </div>
  <div class="foot"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="6.5" y="6.5" width="8" height="8" fill="none" stroke="#F5F5F5" stroke-width="2"/><rect x="17.5" y="6.5" width="8" height="8" fill="#D4FF33"/><rect x="6.5" y="17.5" width="8" height="8" fill="none" stroke="#F5F5F5" stroke-width="2"/><rect x="17.5" y="17.5" width="8" height="8" fill="none" stroke="#F5F5F5" stroke-width="2"/></svg></div>
</div>
</body>
</html>
