<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Whygrid — 5 новых знаков</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0E0E0E; --surface:#1A1A1A; --line:#2A2A2A; --text:#F5F5F5; --muted:#8C8C8C; --accent:#D4FF33; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:56px; }
  h1 { font-weight:900; font-size:40px; letter-spacing:-0.02em; margin-bottom:8px; }
  .sub { font-family:'JetBrains Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:48px; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .card { background:var(--surface); border:1px solid var(--line); padding:32px 24px; display:flex; flex-direction:column; align-items:center; gap:26px; }
  .label { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); align-self:flex-start; }
  .big { width:92px; height:92px; }
  .lockup { display:flex; align-items:center; gap:12px; }
  .lockup svg { width:30px; height:30px; }
  .wordmark { font-family:'Inter',sans-serif; font-weight:900; font-size:26px; letter-spacing:-0.01em; }
  .accent-part { color:var(--accent); }
  .text-part { color:var(--text); }
  .fav-block { display:flex; align-items:center; gap:20px; width:100%; justify-content:center; }
  .fav { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .tile { display:inline-flex; align-items:center; justify-content:center; background:#0E0E0E; }
  .t32 { width:32px; height:32px; } .t16 { width:16px; height:16px; }
  .tile svg { width:78%; height:78%; }
  .cap { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); }
  .google { background:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; width:100%; }
  .google .g-fav { width:26px; height:26px; border-radius:50%; overflow:hidden; flex:none; background:#0E0E0E; display:flex; align-items:center; justify-content:center; }
  .google .g-fav svg { width:76%; height:76%; }
  .g-site { font-family:Arial,sans-serif; font-size:13px; color:#202124; line-height:1.2; }
  .g-url { font-family:Arial,sans-serif; font-size:12px; color:#5f6368; }
  .tabbar { background:#202124; padding:8px 8px 0; width:100%; display:flex; }
  .tab { background:#0E0E0E; padding:8px 12px; display:flex; align-items:center; gap:8px; border-radius:8px 8px 0 0; max-width:190px; }
  .tab svg { width:16px; height:16px; flex:none; }
  .tab span { font-family:Arial,sans-serif; font-size:12px; color:#e8eaed; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
  <h1>Whygrid — 5 новых знаков</h1>
  <div class="sub">крупно · в шапке · favicon 32/16px · на белом Google · во вкладке</div>
  <div class="row" id="row"></div>

<script>
const W="#F5F5F5", A="#D4FF33";
// Для каждого знака: svg (обычный) и svg16 (утолщённый для 16px). Без внешнего фона — плитку даёт контейнер.
const marks = [
  {
    id:"1", label:"1 · grid — сетка",
    svg:`<rect x="16" y="16" width="30" height="30" stroke="${W}" stroke-width="5" fill="none"/><rect x="54" y="16" width="30" height="30" fill="${A}"/><rect x="16" y="54" width="30" height="30" stroke="${W}" stroke-width="5" fill="none"/><rect x="54" y="54" width="30" height="30" stroke="${W}" stroke-width="5" fill="none"/>`,
    svg16:`<rect x="14" y="14" width="32" height="32" stroke="${W}" stroke-width="8" fill="none"/><rect x="54" y="14" width="32" height="32" fill="${A}"/><rect x="14" y="54" width="32" height="32" stroke="${W}" stroke-width="8" fill="none"/><rect x="54" y="54" width="32" height="32" stroke="${W}" stroke-width="8" fill="none"/>`
  },
  {
    id:"2", label:"2 · узел решения",
    svg:`<path d="M50 28 L26 58" stroke="${W}" stroke-width="5"/><path d="M50 28 L74 58" stroke="${W}" stroke-width="5"/><rect x="42" y="12" width="16" height="16" fill="none" stroke="${W}" stroke-width="5"/><rect x="18" y="58" width="16" height="16" fill="none" stroke="${W}" stroke-width="5"/><rect x="66" y="58" width="16" height="16" fill="${A}"/>`,
    svg16:`<path d="M50 28 L26 58" stroke="${W}" stroke-width="7"/><path d="M50 28 L74 58" stroke="${W}" stroke-width="7"/><rect x="40" y="10" width="20" height="20" fill="${W}"/><rect x="14" y="56" width="20" height="20" fill="${W}"/><rect x="66" y="56" width="20" height="20" fill="${A}"/>`
  },
  {
    id:"3", label:"3 · лупа — разбор",
    svg:`<rect x="18" y="18" width="44" height="44" fill="none" stroke="${W}" stroke-width="6"/><path d="M56 56 L84 84" stroke="${W}" stroke-width="8" stroke-linecap="square"/><rect x="32" y="32" width="16" height="16" fill="${A}"/>`,
    svg16:`<rect x="14" y="14" width="48" height="48" fill="none" stroke="${W}" stroke-width="9"/><path d="M54 54 L86 86" stroke="${W}" stroke-width="11" stroke-linecap="square"/><rect x="30" y="30" width="16" height="16" fill="${A}"/>`
  },
  {
    id:"4", label:"4 · ступени — рост",
    svg:`<rect x="14" y="62" width="22" height="22" fill="${W}"/><rect x="39" y="44" width="22" height="22" fill="${W}"/><rect x="64" y="26" width="22" height="22" fill="${A}"/>`,
    svg16:`<rect x="12" y="62" width="24" height="24" fill="${W}"/><rect x="38" y="42" width="24" height="24" fill="${W}"/><rect x="64" y="22" width="24" height="24" fill="${A}"/>`
  },
  {
    id:"5", label:"5 · призма — разложить",
    svg:`<path d="M48 18 L80 74 L16 74 Z" fill="none" stroke="${W}" stroke-width="5"/><path d="M6 52 L40 58" stroke="${W}" stroke-width="5" stroke-linecap="square"/><path d="M58 58 L94 46" stroke="${A}" stroke-width="6" stroke-linecap="square"/>`,
    svg16:`<path d="M48 16 L82 76 L14 76 Z" fill="none" stroke="${W}" stroke-width="8"/><path d="M60 58 L94 44" stroke="${A}" stroke-width="9" stroke-linecap="square"/>`
  },
];

const svg = (inner, cls="") => `<svg class="${cls}" viewBox="0 0 100 100" fill="none">${inner}</svg>`;
const row = document.getElementById("row");
row.innerHTML = marks.map(m => `
  <div class="card">
    <div class="label">${m.label}</div>
    ${svg(m.svg,"big")}
    <div class="lockup">${svg(m.svg)}<div class="wordmark"><span class="accent-part">WHY</span><span class="text-part">GRID</span></div></div>
    <div class="fav-block">
      <div class="fav"><div class="tile t32">${svg(m.svg)}</div><div class="cap">32px</div></div>
      <div class="fav"><div class="tile t16">${svg(m.svg16)}</div><div class="cap">16px</div></div>
    </div>
    <div class="google"><div class="g-fav">${svg(m.svg)}</div><div><div class="g-site">Whygrid</div><div class="g-url">whygrid.app</div></div></div>
    <div class="tabbar"><div class="tab">${svg(m.svg16)}<span>Whygrid — AI-тренер</span></div></div>
  </div>
`).join("");
</script>
</body>
</html>
